<!doctype html>
<html lang="de-AT" data-theme="dunkel">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo-pzl.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#191b20" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PZL Return-to-Sport</title>
    <script>
      // Hell/Dunkel sofort setzen, damit beim Start nichts aufblitzt (keine Pat.-Daten, nur die Darstellung)
      try {
        if (localStorage.getItem('pzl-darstellung') === 'hell') document.documentElement.dataset.theme = 'hell'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
