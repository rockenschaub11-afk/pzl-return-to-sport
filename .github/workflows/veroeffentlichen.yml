# Veröffentlichen auf GitHub Pages (Etappe 11): bei jedem Push auf master
# werden Tests ausgeführt, die App gebaut und unter https://rockenschaub11-afk.github.io/pzl-return-to-sport/ bereitgestellt.
# Im Repository enthalten ist nur Code – nie Pat.-Daten (die liegen nur im Browser der Laptops).
name: Veröffentlichen

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /pzl-return-to-sport/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  bereitstellen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
